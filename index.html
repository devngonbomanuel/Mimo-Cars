<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./Assets/css/index.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>Inicio | MimoCar</title>
  </head>
  <body>
    <div class="principal">
      <div class="left-logo">
        <img src="Assets/img/logo-empresa.png" alt="logo-empresa" />
        <h1>Bem-Vindo ao</h1>
        <h1>Sistema de gestão da MimoCar</h1>
        <small>Powered by Julio-Mesach</small>
      </div>
      <div class="entrar">
        <h1>Login</h1>
        <form>
          <div class="campos">
            <label>E-mail de Usuário</label>
            <input type="email" placeholder="mimocar@gmail.com" required="" />
            <label>Senha</label>
            <input type="password" placeholder="********" required="" />
          </div>
          <input type="checkbox" aria-hidden="true" />
          <a href="#" id="lembrar">Lembrar</a>
          <a href="#" id="esqueci">Esqueci a senha</a>
          <button>
            <a href="Assets/pages/home.html" id="btn-registar">Entrar</a>
          </button>
          <a href="Assets/pages/registar.html" id="btn-registar">Registar</a>
        </form>
      </div>
    </div>
  </body>
</html>
